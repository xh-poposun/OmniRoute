name: TypeScript Typecheck

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "open-sse/**"
      - ".github/workflows/typecheck.yml"

  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "open-sse/**"
      - ".github/workflows/typecheck.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core TypeScript typecheck
        run: npm run typecheck:core

      - name: Open-SSE TypeScript typecheck
        run: npm run check:open-sse-typecheck

      - name: Strict TypeScript typecheck
        run: npm run typecheck:noimplicit:core
